name: aic-retrieval

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: aic-meilisearch
    # KHÔNG set MEILI_MASTER_KEY ở đây mặc định — set biến môi trường (dù rỗng)
    # ĐÃ ĐỦ để Meilisearch tự bật yêu cầu xác thực (khác hẳn "không set gì cả"),
    # đã đo thật gây lỗi 403 invalid_api_key toàn bộ request. Muốn bật khoá thật,
    # thêm dòng "MEILI_MASTER_KEY: ${AIC_MEILI_KEY}" (không có ":-") vào đây.
    environment:
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./volumes/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: aic-backend
    environment:
      AIC_FAISS_DIR: /faiss
      AIC_MEILI_URL: http://meilisearch:7700
      AIC_MEILI_KEY: ${AIC_MEILI_KEY:-}
      AIC_DATA_ROOT: /data
      AIC_ARTIFACTS_ROOT: /artifacts
      # Điền URL/KEY từ notebook Kaggle (indexing/kaggle/11_encode_service.py) —
      # xem README.md mục "Chạy encoder trên Kaggle". Có thể để trong ../.env
      # (docker compose tự đọc) thay vì gõ tay ở đây.
      AIC_REMOTE_ENCODER_URL: ${AIC_REMOTE_ENCODER_URL:-}
      AIC_REMOTE_ENCODER_KEY: ${AIC_REMOTE_ENCODER_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ../data:/data
      - ../artifacts:/artifacts
      - ./volumes/faiss:/faiss
    ports:
      - "8080:8080"
    depends_on:
      - meilisearch

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: aic-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
